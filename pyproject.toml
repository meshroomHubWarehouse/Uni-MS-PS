[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-ms-ps"
version = "1.0.0"
description = "Uni-MS-PS: multi-scale photometric stereo"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # OpenCV 5 wheels are built without OpenEXR: the EXR normal maps need OpenCV 4
    "opencv-python>=4.8.0,<5",
    "numpy",
    "scipy",
    "Pillow",
    "timm",
    "tqdm",
]

[tool.setuptools]
zip-safe = false
py-modules = [
    "meshroom_predict",
    "inference_sfm",
    "sfm_loader",
    "utils",
    "utils_process",
    "deppading",
    "prepare_ps_images",
    "run",
    "Transformer_8",
    "Transformer_8_layer",
    "Transformer_multi_res_7",
    "transformer_modules",
]
